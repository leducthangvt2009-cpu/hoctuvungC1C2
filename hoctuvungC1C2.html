            height: 350px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .flashcard {

        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 20px;
            text-align: center;
        }

        .card-front {
            background-color: #ffffff;
            color: #2980b9;
            border: 2px solid #e0e6ed;
        }

        .card-back {
            background-color: #27ae60;
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .word-text {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .instruction {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 20px;
            font-weight: normal;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }

        button.shuffle-btn {
            background-color: #9b59b6;
        }

        }

        .keyboard-hint {

            color: #95a5a6;

        let currentDeck = [...vocabulary];
        let currentIndex = 0;
        let isFlipped = false;

        const wordEnEl = document.getElementById('word-en');
        const wordViEl = document.getElementById('word-vi');
        const progressTextEl = document.getElementById('progress-text');
        const flashcardEl = document.getElementById('flashcard');

        // Hàm cập nhật nội dung thẻ
        function updateCard() {
            wordEnEl.innerText = currentDeck[currentIndex].en;
            wordViEl.innerText = currentDeck[currentIndex].vi;
            progressTextEl.innerText = `Từ ${currentIndex + 1} / ${currentDeck.length}`;
            
            // Đảm bảo thẻ luôn ngửa khi chuyển câu mới
            if (isFlipped) {
                flashcardEl.classList.remove('flipped');
                isFlipped = false;
            }
        }

        // Hàm lật thẻ
        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcardEl.classList.add('flipped');
            } else {
                flashcardEl.classList.remove('flipped');
            }
        }

        // Chuyển thẻ tiếp theo
        function nextCard() {
            if (currentIndex < currentDeck.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        // Quay lại thẻ trước
        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        // Trộn ngẫu nhiên (Shuffle)
        function shuffleCards() {
            for (let i = currentDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
            }
            currentIndex = 0; // Đưa về thẻ đầu tiên sau khi trộn
            updateCard();
        }

        // Hỗ trợ phím tắt bàn phím
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                prevCard();
            } else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault(); // Tránh bị cuộn trang khi nhấn Space
                flipCard();
            }
        });

        // Khởi tạo trạng thái ban đầu
        updateCard();

    </script>
